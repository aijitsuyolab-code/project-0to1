<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROJECT 0→1 | AI実用研究所</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #070707;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
    }

    header {
      padding: 24px 20px;
      border-bottom: 1px solid #333;
    }

    .logo {
      color: #d4af37;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 50px 20px;
    }

    h1 {
      font-size: 42px;
      line-height: 1.25;
      margin-bottom: 18px;
    }

    .gold {
      color: #d4af37;
    }

    .lead {
      color: #bbbbbb;
      font-size: 18px;
      line-height: 1.8;
      margin-bottom: 40px;
    }

    .card {
      border: 1px solid #3b3320;
      background: #111;
      border-radius: 18px;
      padding: 28px;
      margin-bottom: 20px;
    }

    .card h2 {
      color: #d4af37;
      margin-bottom: 12px;
    }

    .card p {
      color: #cccccc;
      line-height: 1.7;
    }

    .button {
      display: inline-block;
      margin-top: 25px;
      padding: 16px 26px;
      background: #d4af37;
      color: #000;
      text-decoration: none;
      font-weight: bold;
      border-radius: 10px;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 40px 20px;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">AI実用研究所</div>
</header>

<main class="container">

  <h1>
    会社の課題を<br>
    <span class="gold">AIで見える化。</span>
  </h1>

  <p class="lead">
    PROJECT 0→1は、企業や個人事業主の課題を診断し、
    AI・補助金・業務改善・規制対応などの
    改善ポイントを見つける経営支援プロジェクトです。
  </p>

  <div class="card">
    <h2>会社健康診断</h2>
    <p>
      いくつかの質問に答えるだけで、
      今の会社にどんな改善余地があるのかを整理します。
    </p>
  </div>

  <div class="card">
    <h2>AI導入診断</h2>
    <p>
      日々の業務から、AIや自動化で削減できる作業を探します。
    </p>
  </div>

  <div class="card">
    <h2>補助金・支援制度</h2>
    <p>
      会社の条件から活用できる可能性のある支援制度を整理します。
    </p>
  </div>

  <a class="button" href="#">
    無料診断をはじめる
  </a>

</main>

<footer>
  © AI実用研究所 / PROJECT 0→1
</footer>

</body>
</html>
