<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROJECT 0→1 訪問者ダッシュボード</title><meta name="robots" content="noindex,nofollow"><style>body{margin:0;background:#090b0f;color:#f4f1e7;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:1050px;margin:auto;padding:24px}.gold{color:#d9b85d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:#12171e;border:1px solid #2b333e;border-radius:18px;padding:18px}.big{font-size:34px;font-weight:900}.muted{color:#aeb7c2}table{width:100%;border-collapse:collapse;background:#12171e;border-radius:14px;overflow:hidden}th,td{padding:12px;border-bottom:1px solid #29313b;text-align:left}button{background:#d9b85d;color:#16120a;border:0;border-radius:10px;padding:12px 16px;font-weight:900}</style></head><body><main class="wrap"><p class="gold"><b>PROJECT 0→1｜内部用</b></p><h1>サイト訪問者ダッシュボード</h1><p class="muted">個人名・IP・メールは保存せず、匿名の訪問数とページ閲覧数だけ集計。</p><button onclick="loadData()">更新</button><p id="status" class="muted"></p><section id="cards" class="grid"></section><h2>直近7日 人気ページ</h2><div style="overflow:auto"><table><thead><tr><th>サイト</th><th>ページ</th><th>PV</th><th>訪問者</th></tr></thead><tbody id="top"></tbody></table></div></main><script>const fmt=n=>Number(n||0).toLocaleString('ja-JP');async function loadData(){const s=document.getElementById('status');s.textContent='読み込み中…';try{const r=await fetch('/api/visit',{cache:'no-store'});const d=await r.json();if(!d.ok)throw 0;document.getElementById('cards').innerHTML=(d.summary||[]).map(x=>`<article class="card"><h2>${x.site}</h2><div class="big">${fmt(x.visitors_24h)}人</div><div class="muted">24時間の訪問者</div><p>24h PV: <b>${fmt(x.pageviews_24h)}</b><br>7日 訪問者: <b>${fmt(x.visitors_7d)}</b><br>7日 PV: <b>${fmt(x.pageviews_7d)}</b><br>累計 訪問者: <b>${fmt(x.visitors_total)}</b></p></article>`).join('')||'<div class="card">まだ計測データがありません。</div>';document.getElementById('top').innerHTML=(d.top||[]).map(x=>`<tr><td>${x.site}</td><td>${x.path}</td><td>${fmt(x.pageviews)}</td><td>${fmt(x.visitors)}</td></tr>`).join('');s.textContent='更新: '+new Date().toLocaleString('ja-JP')}catch(e){s.textContent='集計を取得できませんでした。数分後に再読み込みしてください。'}}loadData();setInterval(loadData,60000);</script></body></html>
