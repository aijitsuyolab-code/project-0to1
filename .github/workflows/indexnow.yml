name: IndexNow notify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Collect public URLs
        id: urls
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess, xml.etree.ElementTree as ET

          host = "project-0to1.vercel.app"
          base = f"https://{host}"
          before = os.environ.get("BEFORE", "")
          after = os.environ.get("AFTER", "HEAD")
          event_name = os.environ.get("EVENT_NAME", "")

          try:
              if before and set(before) != {"0"}:
                  out = subprocess.check_output(["git", "diff", "--name-only", before, after], text=True)
              else:
                  out = subprocess.check_output(["git", "diff", "--name-only", "HEAD^", "HEAD"], text=True)
          except Exception:
              out = ""

          changed = set(out.splitlines())
          urls = set()

          # A manual run, or a change to this workflow itself, is treated as a
          # bootstrap/resync: submit every canonical URL already in sitemap.xml.
          if event_name == "workflow_dispatch" or ".github/workflows/indexnow.yml" in changed:
              try:
                  root = ET.parse("sitemap.xml").getroot()
                  ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
                  for loc in root.findall("sm:url/sm:loc", ns):
                      if loc.text and loc.text.startswith(base):
                          urls.add(loc.text.strip())
              except Exception as e:
                  print("Could not read sitemap.xml:", e)

          # Normal pushes only notify changed public documents.
          for p in changed:
              if p == "index.html":
                  urls.add(base + "/")
              elif p.endswith(".html") and "/" not in p:
                  urls.add(base + "/" + p)
              elif p in {"sitemap.xml", "robots.txt", "llms.txt"}:
                  urls.add(base + "/" + p)

          url_list = sorted(urls)[:10000]
          with open("indexnow-candidates.json", "w", encoding="utf-8") as f:
              json.dump(url_list, f, ensure_ascii=False)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"candidate_count={len(url_list)}\n")

          print("IndexNow candidate URLs:", len(url_list))
          for u in url_list:
              print(u)
          PY
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}

      - name: Wait for production and build payload
        id: live
        if: steps.urls.outputs.candidate_count != '0'
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures, json, os, time, urllib.error, urllib.request

          host = "project-0to1.vercel.app"
          base = f"https://{host}"
          key = "89735cc2594845fd12c203b7894618b4"
          key_url = base + "/" + key + ".txt"

          with open("indexnow-candidates.json", encoding="utf-8") as f:
              candidates = json.load(f)

          def status(url):
              req = urllib.request.Request(url, headers={"User-Agent": "PROJECT-0to1-IndexNow/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=12) as r:
                      return r.status
              except urllib.error.HTTPError as e:
                  return e.code
              except Exception:
                  return 0

          # GitHub Actions and Vercel deploy concurrently. Wait until the key
          # and changed URLs are actually live so crawlers never receive a 404.
          pending = set(candidates)
          live = set()
          for attempt in range(18):
              key_ok = status(key_url) == 200
              if key_ok and pending:
                  with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
                      results = dict(zip(pending, pool.map(status, pending)))
                  for url, code in results.items():
                      if 200 <= code < 400:
                          live.add(url)
                  pending -= live

              print(f"preflight attempt={attempt + 1} key_ok={key_ok} live={len(live)} pending={len(pending)}")
              if key_ok and not pending:
                  break
              time.sleep(10)

          if pending:
              print("Skipping URLs not live after preflight:")
              for u in sorted(pending):
                  print(u)

          url_list = sorted(live)
          with open("indexnow-payload.json", "w", encoding="utf-8") as f:
              json.dump({
                  "host": host,
                  "key": key,
                  "keyLocation": key_url,
                  "urlList": url_list,
              }, f, ensure_ascii=False)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"count={len(url_list)}\n")

          print("IndexNow live URLs:", len(url_list))
          PY

      - name: Notify IndexNow
        if: steps.live.outputs.count != '0'
        run: |
          curl --fail-with-body --retry 2 \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @indexnow-payload.json \
            https://api.indexnow.org/IndexNow
