name: Inject analytics tracker
on:
  push:
    paths:
      - '.github/workflows/analytics-inject.yml'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add tracker to HTML pages
        shell: bash
        run: |
          set -e
          while IFS= read -r -d '' f; do
            [ "$f" = "./analytics.html" ] && continue
            if ! grep -q 'analytics.js' "$f"; then
              python3 - "$f" <<'PY'
          import sys
          p=sys.argv[1]
          s=open(p,encoding='utf-8').read()
          tag='<script src="/analytics.js" defer></script>'
          if '</body>' in s:
              s=s.replace('</body>',tag+'</body>',1)
          else:
              s += '\n'+tag+'\n'
          open(p,'w',encoding='utf-8').write(s)
          PY
            fi
          done < <(find . -type f -name '*.html' -print0)
      - name: Commit changes
        run: |
          git config user.name 'project-0to1-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add '*.html'
          git add '**/*.html' 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: enable visitor tracking on all HTML pages'
          git push
